<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangaut Onboarding</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
    --hangaut-orange: #ffa500;
    --text-dark: #333;
    --text-light: #777;
    --bg-white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #f0f0f0; /* Light gray background to pop the card */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.onboarding-card {
    background-color: var(--bg-white);
    width: 100%;
    max-width: 1000px;
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

/* Content Side Styling */
.content-side {
    flex: 1;
    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.title {
    font-size: 24px;
    color: var(--text-dark);
    margin-bottom: 15px;
    font-weight: 700;
}

.description {
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.6;
    max-width: 350px;
    margin-bottom: 30px;
}

/* Pagination Dots */
.pagination-dots {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
}

.dot {
    width: 8px;
    height: 8px;
    background-color: #e0e0e0;
    border-radius: 50%;
}

.dot.active {
    background-color: var(--hangaut-orange);
}

/* Buttons */
.action-area {
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.btn-next {
    width: 100%;
    padding: 14px;
    background-color: var(--hangaut-orange);
    color: white;
    border: none;    
    border-radius: 25px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
}

.skip-link {
    color: var(--hangaut-orange);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
}

/* Image Side Styling */
.image-side {
    flex: 1;
    position: relative;
    background-color: #eee;
    border-top-right-radius: 40px;
    border-bottom-right-radius: 40px;
    overflow: hidden;
    margin: 15px;
}

.image-side img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.logo-overlay {
    position: absolute;
    top: 30px;
    left: 30px;
    color: white;
    font-weight: bold;
    font-size: 18px;
    z-index: 10;
}

/* --- RESPONSIVE BREAKPOINTS --- */

/* Tablets & Small Laptops */
@media (max-width: 900px) {
    .content-side { padding: 40px; }
}

/* Smartphones */
@media (max-width: 600px) {
    .onboarding-card {
        flex-direction: column-reverse;
        border-radius: 20px;
    }
    
    .image-side { 
        margin: 10px;
        min-height: 250px;
        border-radius: 20px; 
    }

    .content-side {
        padding: 30px 20px 40px 20px;
    }

    .title { font-size: 20px; }
}
    </style>
</head>
