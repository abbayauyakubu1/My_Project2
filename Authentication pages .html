<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangaut Login & Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
    --primary-orange: orange;
    --bg-orange: orange;
    --light-grey: #f5f5f5;
    --text-grey: #888;
}

* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: var(--bg-orange);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.main-wrapper {
    width: 100%;
    max-width: 900px;
}

.page-title {
    color: white;
    font-size: 24px;
    margin-bottom: 20px;
}

.auth-card {
    background: white;
    border-radius: 30px;
    display: flex;
    overflow: hidden;
    min-height: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-bottom: 40px;
}

/* Image Side */
.image-section {
    flex: 1;
    background-size: cover;
    background-position: center;
    padding: 30px;
    position: relative;
    min-height: 300px;
}

.logo-text {
    color: white;
    font-weight: bold;
    font-size: 1.2rem;
}

/* Form Side */
.form-section {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.form-section h2 { margin-bottom: 20px; }

.social-icons {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.social-icons i {
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    cursor: pointer;
}

form { width: 100%; max-width: 300px; }

.input-group { margin-bottom: 15px; }

.input-group label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px 15px;
    background: var(--light-grey);
    border: none;
    border-radius: 20px;
    font-size: 13px;
    outline: none;
}

.pass-wrapper { position: relative; }
.pass-wrapper i {
    position: absolute;
    right: 15px;
    top: 13px;
    color: var(--primary-orange);
    font-size: 12px;
}

.forgot-link {
    display: block;
    text-align: right;
    font-size: 11px;
    color: #333;
    text-decoration: none;
    margin: 5px 0 20px 0;
}

.btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--primary-orange);
    border: none;
    border-radius: 25px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 171, 0, 0.3);
}

.switch-text {
    font-size: 11px;
    margin-top: 20px;
    text-align: center;
    color: var(--text-grey);
}

.switch-text a { color: var(--primary-orange); text-decoration: none; font-weight: bold; }

/* Responsive Design */
@media (max-width: 768px) {
    .auth-card {
        flex-direction: column;
    }
    .image-section {
        min-height: 200px;
    }
}
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h1 class="page-title">Sign In & Sign Up Page</h1>

        <div class="auth-card">
            <div class="image-section" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80');">
                <span class="logo-text">Hangaut</span>
            </div>
            <div class="form-section">
                <h2>Sign In</h2>
                <div class="social-icons">
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-google"></i>
                    <i class="fab fa-apple"></i>
                </div>
                <form>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="pass-wrapper">
                            <input type="password" placeholder="Enter your password">
                            <i class="far fa-eye"></i>
                        </div>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                    <button class="btn-primary">Sign In</button>
                    <p class="switch-text">Don't have an account yet? <a href="#">Sign Up</a></p>
                </form>
                </div>
                </div>

                 <div class="auth-card">
                 <div class="image-section" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80');">
                <span class="logo-text">Hangaut</span>
            </div>
            <div class="form-section">
                <h2>Sign up</h2>
                <div class="social-icons">
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-google"></i>
                    <i class="fab fa-apple"></i>
                </div>
                <form>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="pass-wrapper">
                            <input type="password" placeholder="Enter your password">
                            <i class="far fa-eye"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="pass-wrapper">
                            <input type="password" placeholder="Confirm your password">
                            <i class="far fa-eye"></i>
                        </div>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                    <button class="btn-primary">Sign in</button>
                    <p class="switch-text">Don't have an account yet? <a href="#">Sign Up</a></p>
                </form>

                
        </body>
    </html>
